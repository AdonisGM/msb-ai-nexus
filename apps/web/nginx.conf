server {
  listen 80;
  # Không khai phiên bản nginx trong header và trang lỗi
  server_tokens off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tên tệp trong assets/ có băm nội dung, nên nội dung đổi là tên đổi. Vì thế
  # cache được vĩnh viễn: không bao giờ có chuyện một tên trỏ vào hai nội dung.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Định tuyến nằm ở phía trình duyệt, nên mọi đường dẫn chưa khớp tệp nào đều
  # trả về index.html. Thiếu dòng này thì F5 ở /customers/abc ra 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
