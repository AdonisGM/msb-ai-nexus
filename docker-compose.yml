# Development stack. For now it only runs Postgres — the API and the web app
# stay outside the container so they reload fast while we build.
#
# Values are written literally rather than read from .env on purpose: compose
# auto-loads ./.env, and that file holds real credentials once we deploy, so a
# local `pnpm db:up` must never be able to point at the production database.

name: nexus

services:
  db:
    image: postgres:17-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      # 5433 on the host so it does not collide with the `home` project's
      # Postgres already sitting on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - nexus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chat attachments. One container runs the whole of SeaweedFS — master,
  # volume, filer and the S3 gateway — which is plenty for one machine. The
  # API talks S3 to it and knows nothing else about it.
  #
  # Credentials are literal for the same reason as the database's above. The
  # config is written at start-up so it can come from the environment in
  # production without a second file on the server.
  files:
    image: chrislusf/seaweedfs:3.97
    container_name: nexus-files
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"nexus","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=1024 -volume.max=0
    environment:
      S3_ACCESS_KEY: nexus
      S3_SECRET_KEY: nexus-dev-secret
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - nexus-files:/data

volumes:
  nexus-pgdata:
  nexus-files:
